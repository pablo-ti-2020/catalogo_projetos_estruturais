<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos Estruturais – Material de Estudo</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f2f4f7;
}

header{
  background:#1c2e4a;
  color:white;
  text-align:center;
  padding:30px 20px;
}

main{
  max-width:1100px;
  margin:30px auto;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.topic{
  margin-bottom:50px;
}

h2{
  color:#1c2e4a;
  border-left:5px solid #1c2e4a;
  padding-left:10px;
}

.images{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  margin:20px 0;
}

.images img{
  width:32%;
  border-radius:8px;
  border:1px solid #ddd;
}

.description{
  font-size:16px;
  line-height:1.6;
  text-align:justify;
  color:#333;
}

@media(max-width:768px){
  .images img{ width:48%; }
}

@media(max-width:480px){
  .images img{ width:100%; }
}
</style>
</head>

<body>

<header>
<h1>📘 Projetos Estruturais – Material de Estudo</h1>
</header>

<main>

<!-- GERADO COMPLETO -->

<script>
const data = [
["Qual a função de um pilar?","O pilar tem função estrutural de receber cargas das lajes e transferi-las à fundação, garantindo estabilidade da construção."],
["O que é torque?","Torque é o produto da força pela distância ao eixo de rotação, responsável por gerar movimento de giro."],
["Qual é a unidade de força no SI?","O Newton (N) é a unidade de força no SI, definido como kg·m/s²."],
["Uma barra está sujeita a tração. Isso significa que:","Tração provoca alongamento do elemento estrutural, aumentando seu comprimento."],
["Em equilíbrio estático, a resultante das forças é:","Em equilíbrio, a soma vetorial das forças é zero."],
["O que é diagrama de corpo livre?","Representação de um corpo isolado com todas as forças externas atuantes."],
["Qual vetor representa direção e sentido de uma força?","O vetor força possui magnitude, direção e sentido."],
["Cisalhamento é caracterizado por:","Forças paralelas em sentidos opostos que tendem a cortar o material."],
["Flexão ocorre quando:","Um elemento é curvado devido à ação de momentos fletores."],
["Força peso é calculada por:","Peso é a força da gravidade: P = m·g."],
["O que é torque de um parafuso?","É a tendência de rotação aplicada ao apertar ou soltar o parafuso."],
["O que é uma viga?","Elemento estrutural horizontal que transmite cargas para pilares."],
["O que é cisalhamento?","Ação de forças paralelas opostas que causam corte no material."],
["O que é tração em um cabo?","Força que alonga o cabo aumentando seu comprimento."],
["O que é compressão em um pilar?","Força que comprime o elemento, reduzindo seu comprimento."],
["O que é um diagrama de momentos fletores?","Representa a variação dos momentos ao longo de uma estrutura."],
["Qual unidade mede pressão no SI?","Pascal (Pa), definido como força por área."],
["O que representa o vetor velocidade?","Indica direção e sentido do movimento de um corpo."],
["O que é trabalho mecânico?","Produto da força pelo deslocamento na direção da força."],
["O que é um momento fletor?","Torque interno que causa curvatura em elementos estruturais."],
["O que é energia cinética?","Energia associada ao movimento de um corpo."],
["O que é energia potencial?","Energia armazenada devido à posição ou configuração."],
["O que é um elo estrutural?","Conexão entre elementos estruturais para transferência de esforços."],
["O que é torque em rotação?","Momento de força responsável por causar rotação."],
["O que é torque em engrenagens?","Momento transmitido que faz as engrenagens girarem."],
["O que é flexão em uma viga?","Curvatura causada por momentos fletores."],
["O que é cisalhamento em uma barra?","Corte provocado por forças paralelas opostas."],
["O que é deformação axial?","Alteração no comprimento devido à tração ou compressão."],
["O que é momento torçor (torção)?","Rotação de um elemento em torno de seu eixo longitudinal."],
["O que é módulo de elasticidade?","Medida da rigidez do material (resistência à deformação)."],
["O que é tensão normal?","Força por área atuando perpendicularmente à seção."],
["O que é tensão de cisalhamento?","Força por área atuando paralelamente à seção."],
["O que é carga concentrada?","Força aplicada em um único ponto."],
["O que é carga distribuída?","Força aplicada continuamente ao longo de uma superfície ou linha."],
["O que é apoio simples?","Apoio que restringe deslocamento vertical, permitindo rotação."],
["O que é apoio engastado?","Apoio que impede deslocamentos e rotações."],
["O que é momento fletor máximo?","Ponto onde ocorre o maior esforço de curvatura na viga."],
["O que é esforço normal?","Tensão axial devido a forças ao longo do eixo."],
["O que é esforço cortante?","Força paralela à seção que tende a cortar o material."],
["O que é deslocamento lateral?","Movimento horizontal causado por cargas."],
["O que é deformação unitária?","Relação entre variação de comprimento e comprimento original."],
["O que é carga distribuída triangular?","Carga que varia linearmente ao longo da estrutura."],
["O que é uma viga simplesmente apoiada?","Viga com apoios simples nas extremidades, permitindo rotação."],
["O que é pilar de concreto armado?","Elemento vertical reforçado com aço para resistir a cargas."],
["O que é flambagem?","Instabilidade lateral de elementos comprimidos."],
["O que é momento fletor positivo?","Curvatura com concavidade voltada para cima."],
["O que é momento fletor negativo?","Curvatura com concavidade voltada para baixo."],
["O que é deflexão de viga?","Deslocamento vertical devido às cargas."],
["O que é braço de alavanca?","Distância entre a força aplicada e o eixo de rotação."],
["O que é carga axial?","Força aplicada ao longo do eixo do elemento."],
["O que é pilar excêntrico?","Pilar com carga aplicada fora do eixo central."],
["O que é armadura em concreto?","Aço inserido no concreto para resistir à tração."],
["O que é módulo de ruptura?","Tensão máxima antes da falha do material."],
["O que é pilar de aço?","Elemento vertical metálico que suporta cargas estruturais."],
["O que é linha elástica?","Curva representando a deformação da viga sob carga."]
];

const main = document.querySelector("main");

data.forEach((item, i) => {
  const div = document.createElement("div");
  div.className = "topic";

  div.innerHTML = `
    <h2>${item[0]}</h2>
    <div class="images">
      <img src="https://picsum.photos/400/300?${i*3+1}">
      <img src="https://picsum.photos/400/300?${i*3+2}">
      <img src="https://picsum.photos/400/300?${i*3+3}">
    </div>
    <div class="description">${item[1]}</div>
  `;

  main.appendChild(div);
});
</script>

</main>
</body>
</html>
